server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA history fallback. MSAL returns the user to the redirect URI which may
    # carry a hash/path; without this, nginx 404s instead of serving the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is generated per container start (docker/env.sh) and must never
    # be cached, or a re-created container would serve a stale tenant ID.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
