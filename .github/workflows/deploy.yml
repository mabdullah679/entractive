name: ci-cd

# lint/test/build -> terraform fmt/validate/plan -> apply (deploy) -> smoke test.
# AWS access is OIDC only (no stored keys). Deploys run from prod-hardening;
# nothing here runs on, or deploys from, main.
on:
  push:
    branches: [prod-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: entractive-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: "1.16.6"
  ECR_REPO: pf-entractive-resource-server
  TF_IN_AUTOMATION: "1"

jobs:
  test:
    name: lint / test / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Resource server tests (includes reject-on-bad-token suite)
        working-directory: resource-server
        env:
          AZURE_TENANT_ID: ci-placeholder
          AZURE_CLIENT_ID: ci-placeholder
        run: mvn -B verify
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: spa/package-lock.json }
      - name: SPA build
        working-directory: spa
        run: npm ci && npm run build
      - name: Shell script syntax
        run: bash -n scripts/smoke.sh && bash -n docs/scripts/bootstrap-entra.sh
      - name: Lint shell scripts
        run: shellcheck --severity=error scripts/smoke.sh

  terraform:
    name: terraform fmt / validate / plan
    runs-on: ubuntu-24.04
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate (bootstrap + stack)
        run: |
          for d in infra/bootstrap infra/stack; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::346208529954:role/pf-entractive-gha-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: plan (read-only role)
        working-directory: infra/stack
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=120s -var "image_tag=${GITHUB_SHA}"

  deploy:
    name: apply (deploy)
    needs: [test, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions: { id-token: write, contents: read }
    outputs:
      site_url: ${{ steps.out.outputs.site_url }}
      alb: ${{ steps.out.outputs.alb }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::346208529954:role/pf-entractive-gha-apply
          aws-region: ${{ env.AWS_REGION }}
      - name: Guard - correct account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "346208529954"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push resource-server image (tag = git SHA)
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO}:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name "$ECR_REPO" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "image $GITHUB_SHA already in ECR - reusing (tags are immutable)"
          else
            docker build -t "$IMAGE" resource-server
            docker push "$IMAGE"
          fi
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: terraform apply
        working-directory: infra/stack
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=120s -var "image_tag=${GITHUB_SHA}" -out=tfplan
          terraform apply -input=false -no-color -lock-timeout=120s tfplan
      - name: Read outputs
        id: out
        working-directory: infra/stack
        run: |
          echo "site_url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"
          echo "alb=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: spa/package-lock.json }
      - name: Build SPA
        working-directory: spa
        run: npm ci && npm run build
      - name: Write runtime config.js from SSM (no code change needed to change tenant)
        env:
          SITE_URL: ${{ steps.out.outputs.site_url }}
        run: |
          get() { aws ssm get-parameter --name "/pf-entractive/$1" --query Parameter.Value --output text; }
          cat > spa/dist/config.js <<JS
          window.__APP_CONFIG__ = {
            VITE_AZURE_CLIENT_ID: "$(get spa-client-id)",
            VITE_AZURE_TENANT_ID: "$(get tenant-id)",
            VITE_AZURE_REDIRECT_URI: "${SITE_URL}",
            VITE_API_BASE_URL: "",
            VITE_API_SCOPE: "$(get api-scope)"
          };
          JS
          # Placeholder values are allowed (README says so) but must be loud.
          if grep -q PLACEHOLDER spa/dist/config.js; then echo "::warning::SSM still holds PLACEHOLDER Entra IDs - sign-in will not work"; fi
      - name: Upload SPA to S3 and invalidate CloudFront
        working-directory: infra/stack
        run: |
          BUCKET=$(terraform output -raw spa_bucket)
          DIST=$(terraform output -raw cloudfront_distribution_id)
          # Hashed assets: long cache. index.html + config.js: never cached.
          aws s3 sync ../../spa/dist "s3://$BUCKET" --delete --exclude index.html --exclude config.js \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp ../../spa/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-store" --content-type text/html
          aws s3 cp ../../spa/dist/config.js "s3://$BUCKET/config.js" --cache-control "no-store" --content-type application/javascript
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/index.html" "/config.js" "/" >/dev/null

  smoke:
    name: smoke test
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CloudFront to serve the new config
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ needs.deploy.outputs.site_url }}/config.js" | grep -q "${{ needs.deploy.outputs.site_url }}" && break
            sleep 10
          done
      - name: Run smoke tests
        run: scripts/smoke.sh "${{ needs.deploy.outputs.site_url }}" "${{ needs.deploy.outputs.alb }}"
