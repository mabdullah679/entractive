name: ci-cd

# lint/test/build -> terraform fmt/validate/plan -> apply (deploy) -> smoke test.
# One image holds the API and the built SPA; API Gateway gives it a public HTTPS URL.
# AWS access is OIDC only (no stored keys). Deploys run from prod-hardening;
# nothing here runs on, or deploys from, main.
on:
  push:
    branches: [prod-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: entractive-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: "1.16.6"
  ECR_REPO: pf-entractive-resource-server
  TF_IN_AUTOMATION: "1"

jobs:
  test:
    name: lint / test / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Resource server tests (includes reject-on-bad-token suite)
        working-directory: resource-server
        env:
          AZURE_TENANT_ID: ci-placeholder
          AZURE_CLIENT_ID: ci-placeholder
        run: mvn -B verify
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: spa/package-lock.json }
      - name: SPA build
        working-directory: spa
        run: npm ci && npm run build
      - name: Shell script syntax
        run: bash -n scripts/smoke.sh && bash -n docs/scripts/bootstrap-entra.sh
      - name: Lint shell scripts
        run: shellcheck --severity=error scripts/smoke.sh

  terraform:
    name: terraform fmt / validate / plan
    runs-on: ubuntu-24.04
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate (bootstrap + stack)
        run: |
          for d in infra/bootstrap infra/stack; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::346208529954:role/pf-entractive-gha-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: plan (read-only role)
        working-directory: infra/stack
        run: |
          terraform init -input=false
          # -lock=false: speculative, read-only plan; must not contend with the deploy run for the state lock
          terraform plan -input=false -no-color -lock=false -var "image_tag=${GITHUB_SHA}"

  deploy:
    name: apply (deploy)
    needs: [test, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions: { id-token: write, contents: read }
    outputs:
      site_url: ${{ steps.out.outputs.site_url }}
      alb: ${{ steps.out.outputs.alb }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::346208529954:role/pf-entractive-gha-apply
          aws-region: ${{ env.AWS_REGION }}
      - name: Guard - correct account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "346208529954"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push the app image (API + built SPA, tag = git SHA)
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO}:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name "$ECR_REPO" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "image $GITHUB_SHA already in ECR - reusing (tags are immutable)"
          else
            docker build -f Dockerfile.aws -t "$IMAGE" .
            docker push "$IMAGE"
          fi
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: terraform apply
        working-directory: infra/stack
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=120s -var "image_tag=${GITHUB_SHA}" -out=tfplan
          terraform apply -input=false -no-color -lock-timeout=120s tfplan
      - name: Read outputs
        id: out
        working-directory: infra/stack
        run: |
          echo "site_url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"
          echo "alb=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"

  smoke:
    name: smoke test
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the edge to answer
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ needs.deploy.outputs.site_url }}/actuator/health" | grep -q UP && break
            sleep 10
          done
      - name: Run smoke tests
        run: scripts/smoke.sh "${{ needs.deploy.outputs.site_url }}" "${{ needs.deploy.outputs.alb }}"
