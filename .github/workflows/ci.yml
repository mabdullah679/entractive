name: ci

# Pull-request / main checks. Free GitHub-hosted runners, no AWS access, no secrets.
# Same commands as local: `mvn verify`, `npm ci && npm run build`, `terraform fmt/validate`.
# The AWS pipeline (plan/apply/smoke) is deploy.yml and does not run on pull requests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: resource-server tests / SPA build / shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21", cache: maven, cache-dependency-path: resource-server/pom.xml }
      - name: Resource server tests (offline, mock JWKS)
        working-directory: resource-server
        env:
          AZURE_TENANT_ID: ci-placeholder
          AZURE_CLIENT_ID: ci-placeholder
        run: mvn -B verify
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20", cache: npm, cache-dependency-path: spa/package-lock.json }
      - name: SPA build
        working-directory: spa
        run: npm ci && npm run build
      - name: Shell scripts
        run: |
          bash -n scripts/smoke.sh && bash -n docs/scripts/bootstrap-entra.sh
          shellcheck --severity=error scripts/smoke.sh

  terraform-static:
    name: terraform fmt / validate (no AWS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.16.6" }
      - run: terraform fmt -check -recursive infra
      - name: validate (bootstrap + stack, backend disabled)
        run: |
          for d in infra/bootstrap infra/stack; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
