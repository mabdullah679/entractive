name: oidc-debug
on:
  workflow_dispatch:
  push:
    branches: [prod-hardening]
permissions: { id-token: write, contents: read }
jobs:
  claims:
    runs-on: ubuntu-24.04
    steps:
      - name: Show non-secret OIDC claims
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$T" | cut -d. -f2 | python3 -c "import sys,base64,json;s=sys.stdin.read().strip();s+='='*(-len(s)%4);d=json.loads(base64.urlsafe_b64decode(s));print({k:d[k] for k in ('sub','aud','iss','repository','ref','job_workflow_ref')})"
